<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <title>kcalm</title>
    <style>
      :root {
        --background: #edf3ef;
        --foreground: #0d1f19;
        --muted: #52645c;
        --primary: #07704f;
        --primary-foreground: #f2fbf7;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --background: #0a1915;
          --foreground: #e6f4ee;
          --muted: #8fa89d;
          --primary: #3ddba6;
          --primary-foreground: #04281c;
        }
      }

      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        box-sizing: border-box;
        background: var(--background);
        color: var(--foreground);
        font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }

      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        max-width: 22rem;
      }

      h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 600;
        text-wrap: balance;
      }

      a {
        display: inline-flex;
        align-items: center;
        min-height: 48px;
        padding: 0 24px;
        border-radius: 12px;
        background: var(--primary);
        color: var(--primary-foreground);
        font-weight: 600;
        text-decoration: none;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        text-wrap: pretty;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="opening">Открываем «Быстрые команды»…</h1>
      <a id="link" href="shortcuts://">Открыть «Быстрые команды»</a>
      <p id="hint">Если ничего не открылось, нажмите кнопку. Потом вернитесь в Telegram.</p>
    </main>
    <script>
      const texts = {
        ru: {
          opening: 'Открываем «Быстрые команды»…',
          run: 'Запустить kcalm',
          open: 'Открыть «Быстрые команды»',
          hint: 'Если ничего не открылось, нажмите кнопку. Потом вернитесь в Telegram.',
        },
        uk: {
          opening: 'Відкриваємо «Швидкі команди»…',
          run: 'Запустити kcalm',
          open: 'Відкрити «Швидкі команди»',
          hint: 'Якщо нічого не відкрилося, натисніть кнопку. Потім поверніться в Telegram.',
        },
        en: {
          opening: 'Opening Shortcuts…',
          run: 'Run kcalm',
          open: 'Open Shortcuts',
          hint: 'If nothing opened, tap the button. Then come back to Telegram.',
        },
      };
      const targets = {
        run: 'shortcuts://run-shortcut?name=kcalm',
        open: 'shortcuts://',
      };
      const params = new URLSearchParams(location.search);
      const language = ['ru', 'uk', 'en'].includes(params.get('lang')) ? params.get('lang') : 'ru';
      const action = params.get('do') === 'run' ? 'run' : 'open';
      const text = texts[language];
      const link = document.getElementById('link');
      document.documentElement.lang = language;
      document.getElementById('opening').textContent = text.opening;
      document.getElementById('hint').textContent = text.hint;
      link.textContent = text[action];
      link.href = targets[action];
      window.addEventListener('load', () => location.replace(targets[action]));
    </script>
  </body>
</html>
